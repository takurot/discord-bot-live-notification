name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:coverage -- --runInBand

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Summarize coverage
        id: coverage
        if: always()
        run: |
          set -euo pipefail
          summary_file="coverage-summary.md"

          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const summary = require("./coverage/coverage-summary.json");
              const totals = summary.total ?? {};
              const fmt = (metric) => (metric ? `${metric.covered}/${metric.total}` : "n/a");
              const pct = (metric) => (metric?.pct ?? 0).toFixed(2);
              console.log("| Metric | Coverage | Covered |");
              console.log("|--------|----------|---------|");
              console.log(`| Lines | ${pct(totals.lines)}% | ${fmt(totals.lines)} |`);
              console.log(`| Statements | ${pct(totals.statements)}% | ${fmt(totals.statements)} |`);
              console.log(`| Functions | ${pct(totals.functions)}% | ${fmt(totals.functions)} |`);
              console.log(`| Branches | ${pct(totals.branches)}% | ${fmt(totals.branches)} |`);
            ' > "$summary_file"
          else
            echo 'Coverage summary not available (tests may have failed before generating reports).' > "$summary_file"
          fi

          {
            echo "summary<<EOF"
            cat "$summary_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Test Coverage'
            cat "$summary_file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          COVERAGE_SUMMARY: ${{ steps.coverage.outputs.summary }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = process.env.COVERAGE_SUMMARY ?? 'Coverage summary unavailable.';
            const body = [
              '## ✅ CI results',
              '- Lint / Type check / Tests completed successfully',
              '',
              summary
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
