name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:coverage -- --runInBand

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Summarize coverage
        id: coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node <<'EOF' > coverage-summary.md
            const summary = require('./coverage/coverage-summary.json');
            function fmt(metric) {
              return metric ? `${metric.covered}/${metric.total}` : 'n/a';
            }
            const totals = summary.total ?? {};
            const lines = totals.lines?.pct ?? 0;
            const functions = totals.functions?.pct ?? 0;
            const statements = totals.statements?.pct ?? 0;
            const branches = totals.branches?.pct ?? 0;
            console.log('| Metric | Coverage | Covered |');
            console.log('|--------|----------|---------|');
            console.log(`| Lines | ${lines.toFixed(2)}% | ${fmt(totals.lines)} |`);
            console.log(`| Statements | ${statements.toFixed(2)}% | ${fmt(totals.statements)} |`);
            console.log(`| Functions | ${functions.toFixed(2)}% | ${fmt(totals.functions)} |`);
            console.log(`| Branches | ${branches.toFixed(2)}% | ${fmt(totals.branches)} |`);
            EOF
          else
            echo 'Coverage summary not available (tests may have failed before generating reports).' > coverage-summary.md
          fi

          echo "summary<<'EOF'" >> "$GITHUB_OUTPUT"
          cat coverage-summary.md >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

          echo '### Test Coverage' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          COVERAGE_SUMMARY: ${{ steps.coverage.outputs.summary }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = process.env.COVERAGE_SUMMARY ?? 'Coverage summary unavailable.';
            const body = [
              '## ✅ CI results',
              '- Lint / Type check / Tests completed successfully',
              '',
              summary
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

