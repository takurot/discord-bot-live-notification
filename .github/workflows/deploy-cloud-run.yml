name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'streampulse-bot' }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'streampulse' }}
  CLOUD_SQL_INSTANCE: ${{ secrets.GCP_CLOUD_SQL_INSTANCE }}
  RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
  SECRET_MAPPINGS: ${{ secrets.CLOUD_RUN_SECRET_MAPPINGS }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ env.PROJECT_ID != '' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev"

      - name: Build and push container image
        id: build
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/streampulse-bot:${{ github.sha }}
        run: |
          gcloud builds submit \
            --project "${PROJECT_ID}" \
            --tag "${IMAGE}" \
            .
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          DEPLOY_ARGS=(
            --project "${PROJECT_ID}"
            --region "${REGION}"
            --platform managed
            --image "${IMAGE}"
            --service "${SERVICE}"
            --port=3000
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=512Mi
            --set-env-vars "NODE_ENV=production,PORT=3000"
          )

          if [ -n "${RUNTIME_SERVICE_ACCOUNT}" ]; then
            DEPLOY_ARGS+=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi

          if [ -n "${CLOUD_SQL_INSTANCE}" ]; then
            DEPLOY_ARGS+=(--add-cloudsql-instances "${CLOUD_SQL_INSTANCE}")
          fi

          if [ -n "${SECRET_MAPPINGS}" ]; then
            DEPLOY_ARGS+=(--set-secrets "${SECRET_MAPPINGS}")
          fi

          gcloud run deploy "${SERVICE}" "${DEPLOY_ARGS[@]}"
